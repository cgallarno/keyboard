# keyd config: the Omarchy counterpart of karabiner/karabiner.json.
# Installed to /etc/keyd/default.conf by script/setup-omarchy.
#
# Keep the Keychron in Mac mode so the bottom row is Ctrl, Option, Cmd, Space
# on both machines. On Linux, Cmd is Super (meta) and Option is Alt.

[ids]
*

# S and D count as a chord only when both go down within 150ms of each other,
# and the chord only turns on after being held for 100ms, so rolls like the
# "ds" in "kids" still type normally.
[global]
chord_timeout = 150
chord_hold_timeout = 100

[main]
# Tap for Escape, hold for Control.
capslock = overload(control, esc)

# Hold S and D together for (S)uper (D)uper Mode.
s+d = layer(superduper)

# Right Cmd is Hyper (Super+Ctrl+Alt+Shift), for launching apps. The
# Keychron has no right Option; Right Option still works on keyboards that do.
rightmeta = layer(hyper)
rightalt = layer(hyper)

[hyper:C-A-M-S]

[superduper]
h = left
j = down
k = up
l = right

# f = Command, a = Option, space = Shift. With f held, h and l send Cmd+Left
# and Cmd+Right, which Hyprland turns into Home and End (omarchy/hypr/cmd.lua).
f = layer(meta)
a = layer(sda)
space = layer(shift)

# Tabs: previous / next / first / last.
i = C-pageup
o = C-pagedown
u = C-1
p = C-9

# Show the keymap (sends Hyper+M, see omarchy/hypr/hyper.lua).
slash = C-A-M-S-m

# S+D with A (Option) held: previous / next word, page down / up.
[sda]
h = C-left
l = C-right
j = pagedown
k = pageup
